x-cluster-config:
  # Servidor de referencia: 15 cores / 50 GB RAM.
  # 4 workers x 8g = 32 GB, dejando 18 GB libres para el master, Docker y el SO.
  # 4 workers x 3 cores = 12 cores, dejando 3 cores libres para el master,
  # Docker y el SO. Sube worker-cores solo si el host no corre nada más en
  # paralelo; en un servidor compartido es más seguro dejar 2 en vez de 3.
  worker-count: &worker-count 4
  worker-memory: &worker-memory "8g"
  worker-cores: &worker-cores "3"
  # Master usado por defecto al lanzar spark-submit/spark-sql sin --master
  # explícito: "yarn" o "spark://spark-master:7077". Se expone como la
  # variable de entorno SPARK_MASTER_DEFAULT dentro de spark-master, p.ej.:
  #   docker compose exec spark-master spark-submit --master $SPARK_MASTER_DEFAULT ...
  # yarn.nodemanager.resource.memory-mb/cpu-vcores en conf/hadoop/yarn-site.xml
  # deben coincidir manualmente con worker-memory/worker-cores.
  spark-master-default: &spark-master-default "yarn"

# Credencial única para todas las herramientas del lab (MinIO, Polaris, Hive
# Postgres, ClickHouse). Es la misma en todos lados a propósito, para no tener
# que recordar una distinta por servicio en un entorno de laboratorio.
# POLARIS_BOOTSTRAP_CREDENTIALS (abajo), conf/hive-site.xml y
# conf/spark-defaults.conf NO pueden referenciar estos anchors porque son
# strings compuestos o archivos fuera de este YAML: si cambias este valor,
# actualízalos ahí también a mano.
x-lab-credentials:
  lab-user: &lab-user admin
  lab-password: &lab-password pass1234

x-minio-env: &minio-env
  MINIO_ROOT_USER: *lab-user
  MINIO_ROOT_PASSWORD: *lab-password

x-hive-env: &hive-env
  DEFAULT_FS: s3a://warehouse
  HIVE_WAREHOUSE_PATH: s3a://warehouse/hive
  AWS_ACCESS_KEY_ID: *lab-user
  AWS_SECRET_ACCESS_KEY: *lab-password
  S3_ENDPOINT_URL: http://minio:9000

x-polaris-env: &polaris-env
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: *lab-user
  AWS_SECRET_ACCESS_KEY: *lab-password
  # Debe coincidir manualmente con lab-user/lab-password: "REALM,client_id,client_secret".
  POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,admin,pass1234
  polaris.realm-context.realms: POLARIS
  quarkus.otel.sdk.disabled: "true"

services:

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    hostname: minio
    command: server /data --console-address ":9001"
    environment: *minio-env
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment: *minio-env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/warehouse
      "

  hive-postgres:
    image: postgres:16-alpine
    container_name: hive-postgres
    hostname: hive-postgres
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: *lab-user
      POSTGRES_PASSWORD: *lab-password
    ports:
      - "15433:5432"
    volumes:
      - hive_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 5s
      timeout: 3s
      retries: 30

  hive-metastore:
    image: spark-cluster-lab-hive:3.1.0
    build:
      context: .
      dockerfile: docker/hive/Dockerfile
    container_name: hive-metastore
    hostname: hive-metastore
    depends_on:
      hive-postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment: *hive-env
    command: >
      bash -lc "
      schematool -dbType postgres -initSchema || true;
      exec hive --service metastore
      "
    ports:
      - "19083:9083"
    healthcheck:
      # service_started (contenedor arrancado) no alcanza: el schematool -initSchema
      # tarda unos segundos y el metastore Thrift no queda escuchando hasta despues.
      # hiveserver2 dependia de "started", arrancaba antes de que esto respondiera,
      # fallaba su conexion inicial al metastore y quedaba colgado sin reintentar.
      # CMD-SHELL corre con /bin/sh (dash en esta imagen), que no soporta
      # /dev/tcp: hay que invocar bash explicitamente para ese truco.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9083"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  hiveserver2:
    image: spark-cluster-lab-hive:3.1.0
    build:
      context: .
      dockerfile: docker/hive/Dockerfile
    container_name: hiveserver2
    hostname: hiveserver2
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *hive-env
    command: >
      bash -lc "exec hiveserver2"
    ports:
      - "11000:10000"
      - "11002:10002"

  polaris:
    image: apache/polaris:latest
    container_name: polaris
    hostname: polaris
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment: *polaris-env
    ports:
      - "18181:8181"
      - "18182:8182"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  polaris-setup:
    image: alpine/curl:8.21.0
    container_name: polaris-setup
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      CLIENT_ID: *lab-user
      CLIENT_SECRET: *lab-password
      CATALOG_NAME: lakehouse
      REALM: POLARIS
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        apk add --no-cache jq
        TOKEN=$$(curl --fail-with-body -s -S -X POST http://polaris:8181/api/catalog/v1/oauth/tokens \
          -H 'Content-Type: application/x-www-form-urlencoded' \
          -d "grant_type=client_credentials&client_id=$${CLIENT_ID}&client_secret=$${CLIENT_SECRET}&scope=PRINCIPAL_ROLE:ALL" \
          | jq -r '.access_token')
        PAYLOAD='{
          "catalog": {
            "name": "'$${CATALOG_NAME}'",
            "type": "INTERNAL",
            "readOnly": false,
            "properties": {
              "default-base-location": "s3://warehouse/polaris"
            },
            "storageConfigInfo": {
              "storageType": "S3",
              "allowedLocations": ["s3://warehouse/polaris"],
              "endpoint": "http://100.85.61.29:19000",
              "endpointInternal": "http://minio:9000",
              "pathStyleAccess": true,
              "region": "us-east-1"
            }
          }
        }'
        curl -s -S -X POST http://polaris:8181/api/management/v1/catalogs \
          -H "Authorization: Bearer $${TOKEN}" \
          -H "Polaris-Realm: $${REALM}" \
          -H "Content-Type: application/json" \
          -d "$${PAYLOAD}" || true

  clickhouse:
    image: clickhouse/clickhouse-server:24.8.4.13
    container_name: clickhouse
    hostname: clickhouse
    environment:
      # La imagen oficial ELIMINA el usuario "default" al fijar estas dos
      # variables y lo reemplaza por lab-user/lab-password. Cualquier curl,
      # clickhouse-client o driver debe autenticarse con esa credencial.
      CLICKHOUSE_USER: *lab-user
      CLICKHOUSE_PASSWORD: *lab-password
    ports:
      - "18123:8123"
      - "19010:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  hadoop-namenode:
    image: spark-cluster-lab-hadoop:3.3.4
    build:
      context: .
      dockerfile: docker/hadoop/Dockerfile
    container_name: hadoop-namenode
    hostname: hadoop-namenode
    command: >
      bash -lc "
      [ -d /opt/hadoop/data/nameNode/current ] || hdfs namenode -format -force -nonInteractive;
      exec hdfs namenode
      "
    ports:
      - "19870:9870"
    volumes:
      - hdfs_namenode_data:/opt/hadoop/data/nameNode
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9870/dfshealth.html"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  hadoop-datanode:
    image: spark-cluster-lab-hadoop:3.3.4
    build:
      context: .
      dockerfile: docker/hadoop/Dockerfile
    depends_on:
      hadoop-namenode:
        condition: service_healthy
    command: >
      bash -lc "exec hdfs datanode"
    deploy:
      replicas: *worker-count

  yarn-resourcemanager:
    image: spark-cluster-lab-hadoop:3.3.4
    build:
      context: .
      dockerfile: docker/hadoop/Dockerfile
    container_name: yarn-resourcemanager
    hostname: yarn-resourcemanager
    depends_on:
      hadoop-namenode:
        condition: service_healthy
    command: >
      bash -lc "exec yarn resourcemanager"
    ports:
      - "18088:8088"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/cluster"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  yarn-nodemanager:
    image: spark-cluster-lab-hadoop:3.3.4
    build:
      context: .
      dockerfile: docker/hadoop/Dockerfile
    depends_on:
      yarn-resourcemanager:
        condition: service_healthy
      hadoop-datanode:
        condition: service_started
    command: >
      bash -lc "exec yarn nodemanager"
    deploy:
      replicas: *worker-count

  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile

    container_name: spark-master

    hostname: spark-master

    depends_on:
      hive-metastore:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      polaris-setup:
        condition: service_completed_successfully
      yarn-resourcemanager:
        condition: service_healthy

    environment:
      SPARK_MASTER_DEFAULT: *spark-master-default
      HADOOP_CONF_DIR: /opt/hadoop-conf
      YARN_CONF_DIR: /opt/hadoop-conf

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master

    ports:
      - "17077:7077"
      - "18080:8080"

    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./conf/hadoop:/opt/hadoop-conf:ro

  spark-worker:

    build:
      context: .
      dockerfile: docker/spark/Dockerfile

    depends_on:
      spark-master:
        condition: service_started

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - *worker-cores
      - --memory
      - *worker-memory
      - spark://spark-master:7077

    deploy:
      replicas: *worker-count

    mem_limit: *worker-memory

    cpus: *worker-cores

    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

volumes:
  minio_data:
  hive_postgres_data:
  clickhouse_data:
  clickhouse_logs:
  hdfs_namenode_data:

networks:
  default:
    # Sin esto, Compose nombra la red "<proyecto>_default" (con guion bajo).
    # Docker usa ese nombre como dominio de busqueda DNS dentro de los
    # contenedores, y HiveServer2 (HiveMetaStoreClient.resolveUris) intenta
    # canonicalizar "hive-metastore" a "hive-metastore.spark-cluster-lab_default",
    # que java.net.URI rechaza por el guion bajo (invalido en un hostname):
    # "Illegal character in hostname". Un nombre de red sin guion bajo evita
    # el problema de raiz.
    name: spark-cluster-lab
