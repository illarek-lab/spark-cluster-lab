x-cluster-config:
  # Servidor de referencia: 15 cores / 50 GB RAM.
  # 4 workers x 8g = 32 GB, dejando 18 GB libres para el master, Docker y el SO.
  # 4 workers x 3 cores = 12 cores, dejando 3 cores libres para el master,
  # Docker y el SO. Sube worker-cores solo si el host no corre nada más en
  # paralelo; en un servidor compartido es más seguro dejar 2 en vez de 3.
  worker-count: &worker-count 4
  worker-memory: &worker-memory "8g"
  worker-cores: &worker-cores "3"

x-minio-env: &minio-env
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin

x-hive-env: &hive-env
  DEFAULT_FS: s3a://warehouse
  HIVE_WAREHOUSE_PATH: s3a://warehouse/hive
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  S3_ENDPOINT_URL: http://minio:9000

x-polaris-env: &polaris-env
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
  polaris.realm-context.realms: POLARIS
  quarkus.otel.sdk.disabled: "true"

services:

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    hostname: minio
    command: server /data --console-address ":9001"
    environment: *minio-env
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment: *minio-env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/warehouse
      "

  hive-postgres:
    image: postgres:16-alpine
    container_name: hive-postgres
    hostname: hive-postgres
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    ports:
      - "15433:5432"
    volumes:
      - hive_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 5s
      timeout: 3s
      retries: 30

  hive-metastore:
    image: spark-cluster-lab-hive:3.1.0
    build:
      context: .
      dockerfile: docker/hive/Dockerfile
    container_name: hive-metastore
    hostname: hive-metastore
    depends_on:
      hive-postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment: *hive-env
    command: >
      bash -lc "
      schematool -dbType postgres -initSchema || true;
      exec hive --service metastore
      "
    ports:
      - "19083:9083"

  hiveserver2:
    image: spark-cluster-lab-hive:3.1.0
    build:
      context: .
      dockerfile: docker/hive/Dockerfile
    container_name: hiveserver2
    hostname: hiveserver2
    depends_on:
      hive-metastore:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *hive-env
    command: >
      bash -lc "exec hiveserver2"
    ports:
      - "11000:10000"
      - "11002:10002"

  polaris:
    image: apache/polaris:latest
    container_name: polaris
    hostname: polaris
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment: *polaris-env
    ports:
      - "18181:8181"
      - "18182:8182"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  polaris-setup:
    image: alpine/curl:8.21.0
    container_name: polaris-setup
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      CLIENT_ID: root
      CLIENT_SECRET: s3cr3t
      CATALOG_NAME: lakehouse
      REALM: POLARIS
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        apk add --no-cache jq
        TOKEN=$$(curl --fail-with-body -s -S -X POST http://polaris:8181/api/catalog/v1/oauth/tokens \
          -H 'Content-Type: application/x-www-form-urlencoded' \
          -d "grant_type=client_credentials&client_id=$${CLIENT_ID}&client_secret=$${CLIENT_SECRET}&scope=PRINCIPAL_ROLE:ALL" \
          | jq -r '.access_token')
        PAYLOAD='{
          "catalog": {
            "name": "'$${CATALOG_NAME}'",
            "type": "INTERNAL",
            "readOnly": false,
            "properties": {
              "default-base-location": "s3://warehouse/polaris"
            },
            "storageConfigInfo": {
              "storageType": "S3",
              "allowedLocations": ["s3://warehouse/polaris"],
              "endpoint": "http://localhost:19000",
              "endpointInternal": "http://minio:9000",
              "pathStyleAccess": true,
              "region": "us-east-1"
            }
          }
        }'
        curl -s -S -X POST http://polaris:8181/api/management/v1/catalogs \
          -H "Authorization: Bearer $${TOKEN}" \
          -H "Polaris-Realm: $${REALM}" \
          -H "Content-Type: application/json" \
          -d "$${PAYLOAD}" || true

  clickhouse:
    image: clickhouse/clickhouse-server:24.8.4.13
    container_name: clickhouse
    hostname: clickhouse
    ports:
      - "18123:8123"
      - "19010:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile

    container_name: spark-master

    hostname: spark-master

    depends_on:
      hive-metastore:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      polaris-setup:
        condition: service_completed_successfully

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master

    ports:
      - "17077:7077"
      - "18080:8080"

    volumes:
      - ./warehouse:/warehouse
      - ./data:/data
      - ./jars:/opt/spark/jars-extra
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

  spark-worker:

    build:
      context: .
      dockerfile: docker/spark/Dockerfile

    depends_on:
      spark-master:
        condition: service_started

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - *worker-cores
      - --memory
      - *worker-memory
      - spark://spark-master:7077

    deploy:
      replicas: *worker-count

    mem_limit: *worker-memory

    cpus: *worker-cores

    volumes:
      - ./warehouse:/warehouse
      - ./data:/data
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

volumes:
  minio_data:
  hive_postgres_data:
  clickhouse_data:
  clickhouse_logs:
